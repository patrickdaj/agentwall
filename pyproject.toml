[project]
name = "agentwall"
version = "0.1.0"
description = "Host-side security daemon for AI coding agents"
readme = "README.md"
authors = [
    { name = "Patrick Avery", email = "patrickdaj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.27.1",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
